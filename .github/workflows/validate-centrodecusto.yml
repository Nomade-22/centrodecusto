name: Validate Centro de Custo

on:
  push:
    branches:
      - nextjs-neon-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/centrodecusto
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:4000
      GOOGLE_CLIENT_ID: test-client
      GOOGLE_CLIENT_SECRET: test-secret
      OPENROUTE_API_KEY: test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regressão HH, material e digitação
        run: npx vitest run src/lib/hh-calculator.test.ts src/lib/material-negotiation.test.ts src/components/ui/input.test.tsx

      - name: TypeScript
        run: npm run typecheck

      - name: Next.js build
        run: npm run build
