function renderViagens(){const T=totals(),root=document.getElementById('viagensRoot');let totalKm=S.travels.reduce((a,i)=>a+n(i.distanceKm)*(i.tripType==='round-trip'?2:1)*Math.max(1,n(i.days)),0),totalMin=S.travels.reduce((a,i)=>a+(n(i.manualHours)?n(i.manualHours)*60:n(i.durationMinutes))*(i.tripType==='round-trip'?2:1)*Math.max(1,n(i.days)),0),personHours=S.travels.reduce((a,i)=>{let hrs=n(i.manualHours)||(n(i.durationMinutes)/60);if(i.tripType==='round-trip')hrs*=2;hrs*=Math.max(1,n(i.days));return a+hrs*n(i.people)},0);root.innerHTML=`<div class="space-y"><div class="grid kpi5">${kpi('blue','Distância',totalKm.toFixed(0)+'km','➤')}${kpi('purple','Tempo',(totalMin/60).toFixed(1)+'h','◷')}${kpi('emerald','Pago',(personHours).toFixed(1)+'h','◷')}${kpi('amber','P-Horas',personHours.toFixed(1),'♟')}${kpi('emerald','Custo',money(T.travelSale),'$')}</div>${card('Configurações',`<div class="form3"><div class="field"><label>Regra de Pagamento</label><select class="input" id="payRule"><option value="all" ${S.paymentRule==='all'?'selected':''}>Pagar todos</option><option value="max-hours" ${S.paymentRule==='max-hours'?'selected':''}>Limite de horas</option></select></div><div class="field"><label>Máx. Horas</label>${input('maxHours',S.maxHours)}</div><div class="buttons" style="align-items:end"><button class="btn red" id="travelReset">↻ Zerar</button><button class="btn green" id="travelAdd">＋ Adicionar</button></div></div>`,'$')}${S.travels.map((i,idx)=>`<div class="card item-card"><div class="item-head"><span class="badge">Trecho ${idx+1}</span><div><button class="btn blue route-calc" data-id="${i.id}">⌖ Calcular</button> <button class="btn red travel-del" data-id="${i.id}">✕</button></div></div><div class="form2"><div class="field"><label>Origem</label><input class="input tv-origin" data-id="${i.id}" value="${esc(i.origin)}" placeholder="Ex: Montenegro, RS"></div><div class="field"><label>Destino</label><input class="input tv-dest" data-id="${i.id}" value="${esc(i.desti function currentSnapshot(numero,descricao){return {id:Date.now(),numero,descricao,dados:{legs:deep(S.travels),paymentRule:S.paymentRule,maxHours:S.maxHours,laborItems:S.labor.map(i=>({id:i.id,title:i.title,workerTypeId:i.workerId,clientId:i.clientId,hourTypeId:i.hourId,hours:i.hours,people:i.people,days:i.days})),expensesState:{accommodation:deep(S.accommodation),transport:deep(S.transport),lunches:deep(S.lunches),dinners:deep(S.dinners),breakfasts:deep(S.breakfasts),teamSize:S.teamSize},bdiState:{materials:S.materials.map(m=>({id:m.id,clientId:m.clientId,description:m.description,valorMaterial:m.cost})),lucroPercent:S.margin,jurosDia:S.tax.daily},notaReversaState:{valorBrutoNumerico:S.note.gross}},totais:totals(),created:new Date().toISOString(),updated:new Date().toISOString(),closed:false,taxSnapshot:deep(S.tax)} }
function loadBudget(b){const d=b.dados||{};if(Array.isArray(d.laborItems)&&d.laborItems.length)S.labor=d.laborItems.map(i=>({id:i.id||uid(),title:i.title||'',workerId:i.workerTypeId||'pedreiro',clientId:i.clientId||'jbs',hourId:i.hourTypeId||'normal',hours:n(i.hours),people:n(i.people),days:n(i.days)}));if(Array.isArray(d.legs)&&d.legs.length)S.travels=d.legs.map(i=>({id:i.id||uid(),origin:i.origin||'',destination:i.destination||'',tripType:i.tripType||'one-way',people:n(i.people),days:n(i.days)||1,clientId:i.clientId||'jbs',workerId:i.workerTypeId||'pedreiro',hourId:i.hourTypeId||'normal',manualHours:n(i.manualHours),distanceKm:n(i.distanceKm),durationMinutes:n(i.durationMinutes),error:''}));if(d.expensesState){const e=d.expensesState;if(Array.isArray(e.accommodation)&&e.accommodation.length)S.accommodation=e.accommodation.map(i=>({...i,id:i.id||uid(),clientId:i.clientId||'jbs',location:i.location||'',baseCost:n(i.baseCost),people:n(i.people),days:n(i.days)}));['lunches','dinners','breakfasts'].forEach(k=>{if(Array.isArray(e[k])&&e[k].length)S[k]=e[k].map(i=>({...i,id:i.id||uid(),clientId:i.clientId||'jbs',location:i.location||'',baseCost:n(i.baseCost),people:n(i.people),days:n(i.days)}))});if(Array.isArray(e.transport)&&e.transport.length)S.transport=e.transport.map(i=>({id:i.id||uid(),clientId:i.clientId||'jbs',vehicle:i.vehicleId||'Gol',gas:n(i.gasPricePerLiter),kmpl:n(i.kmPerLiter),toll:n(i.toll),manualKm:n(i.manualKm),trips:n(i.manualViagens)||1}));S.teamSize=n(e.teamSize)||9}if(d.bdiState){S.margin=n(d.bdiState.lucroPercent)||S.margin;if(Array.isArray(d.bdiState.materials)&&d.bdiState.materials.length)S.materials=d.bdiState.materials.map(m=>({id:m.id||uid(),clientId:m.clientId||'jbs',description:m.description||'',cost:n(m.valorMaterial),billing:'service',margin:S.margin}));else if(d.bdiState.valorMaterial!==undefined)S.materials=[{id:uid(),clientId:'jbs',description:'',cost:n(d.bdiState.valorMaterial),billing:'service',margin:S.margin}]}if(d.notaReversaState?.valorBrutoNumerico)S.note.gross=n(d.notaReversaState.valorBrutoNumerico);save();renderAll()}
function renderHistorico(){const root=document.getElementById('historicoRoot'),total=history.reduce((a,b)=>a+Object.values(b.totais||{}).reduce((x,y)=>x+n(y),0),0),closed=history.filter(x=>x.closed),closedV=closed.reduce((a,b)=>a+Object.values(b.totais||{}).reduce((x,y)=>x+n(y),0),0);root.innerHTML=`<div class="space-y"><div class="grid stats4">${kpi('blue','Total de Orçamentos',history.length,'▱')}${kpi('emerald','Valor Total',money(total),'$')}${kpi('amber','Taxa de Fechamento',pct(history.length?closed.length/history.length*100:0,1),'%')}${kpi('green','Valor Fechado',money(closedV),'✓')}</div>${card('Salvar Orçamento',`<div class="form3"><div class="field"><label>Número do Orçamento *</label><input class="input" id="histNum" placeholder="Ex: 0210202601"></div><div class="field"><label>Descrição (opcional)</label><input class="input" id="histDesc" placeholder="Descrição"></div><div class="buttons" style="align-items:end"><button class="btn green" id="histSave">Salvar orçamento atual</button></div></div>`,'▱')}<div class="card history-card"><div class="history-row fw700 muted"><div>Número</div><div>Descrição</div><div>Total</div><div>Status</div><div>Ações</div></div>${history.slice().sort((a,b)=>String(b.created).localeCompare(String(a.created))).map(b=>{const v=Object.values(b.totais||{}).reduce((x,y)=>x+n(y),0);return `<div class="history-row"><div>${esc(b.numero)}</div><div>${esc(b.descricao||'—')}</div><div>${money(v)}</div><div>${b.closed?'<span class="positive">Fechado</span>':'Aberto'}</div><div><button class="btn hist-load" data-id="${b.id}">Carregar</button> <button class="btn hist-close" data-id="${b.id}">${b.closed?'Reabrir':'Fechar'}</button> <button class="btn red hist-del" data-id="${b.id}">Excluir</button></div></div>`}).join('')}</div></div>`;document.getElementById('histSave').onclick=()=>{const num=document.getElementById('histNum').value.trim(),desc=document.getElementById('histDesc').value.trim();if(!num)return alert('Informe o número do orçame function showTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.querySelector('.logout').onclick=()=>alert('GitHub Pages: os dados ficam salvos neste navegador.');
renderAll();
})();
